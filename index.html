	<body>

			<div class="reveal" id="example-deck">

				<!-- DECK_SLIDES -->

			</div>
			</div>
		</div>

		<script>
			window.EXCALIDRAW_ASSET_PATH = new URL(
				'dist/whiteboard/assets/',
				window.location.href
			).href;
		</script>

		<script src="js/platform-bridge-polls.js"></script>

		<script src="js/platform-poll-speaker-bridge.js"></script>
		<script src="js/platform-bridge.js"></script>
		<script src="js/platform-fx-preferences.js"></script>
		<script src="js/platform-slide-notes.js"></script>
		<script src="js/platform-control-panel-settings.js"></script>
		<script src="js/platform-control-panel-notes.js"></script>
		<script src="js/platform-annotation-tools.js"></script>
		<script src="js/platform-control-panel-tools.js"></script>
		<script src="js/platform-control-panel.js"></script>
		<script>
			(function () {
				var params = new URLSearchParams(window.location.search);
				var platformSession =
					params.has('session') && params.has('token');
				Reveal.initialize({
				hash: true,
				slideNumber: 'c/t',
				progress: true,
				center: true,
				transition: 'slide',
				backgroundTransition: 'fade',
				scrollActivationWidth: undefined,
				plugins: [
					RevealHighlight,
					RevealNotes,
					typeof Tldreveal !== 'undefined' ? Tldreveal.Tldreveal() : null,
				].filter(Boolean),
				tldreveal: {
					isDarkMode: true,
					useLocalStorage: !platformSession,
				},
			});
			})();
			Reveal.on('ready', function () {
				var platformSessionParams = new URLSearchParams(window.location.search);
				if (window.PlatformFxPreferences && typeof PlatformFxPreferences.init === 'function') {
					PlatformFxPreferences.init({
						getSessionId: function () {
							return window.PlatformBridge && typeof PlatformBridge.getSessionId === 'function'
								? PlatformBridge.getSessionId()
								: platformSessionParams.get('session');
						},
						getApiBase: function () {
							return window.PlatformBridge && typeof PlatformBridge.getApiBase === 'function'
								? PlatformBridge.getApiBase()
								: '/api/v1';
						},
						isAuthenticated: function () {
							return window.PlatformBridge &&
								typeof PlatformBridge.isAuthenticated === 'function'
								? PlatformBridge.isAuthenticated()
								: false;
						},
						isSessionDeck: function () {
							return platformSessionParams.has('session') && platformSessionParams.has('token');
						},
					});
				}
				if (typeof cp2077FxInit === 'function') {
					cp2077FxInit();
				}
				if (
					window.PlatformFxPreferences &&
					typeof PlatformFxPreferences.loadAndApply === 'function'
				) {
					PlatformFxPreferences.loadAndApply();
				}
				if (typeof cp2077AnnotateLayerInit === 'function') {
					cp2077AnnotateLayerInit();
				}
				if (typeof cp2077WhiteboardBridgeInit === 'function') {
					cp2077WhiteboardBridgeInit();
				}
				if (window.PlatformBridge && PlatformBridge.shouldActivate()) {
					PlatformBridge.init();
				}
				if (window.PlatformControlPanel && typeof PlatformControlPanel.init === 'function') {
					PlatformControlPanel.init();
				}
				if (window.PlatformAnnotationTools && typeof PlatformAnnotationTools.init === 'function') {
					PlatformAnnotationTools.init({
						slideKeyFromReveal: function () {
							return window.PlatformBridge &&
								typeof PlatformBridge.slideKeyFromReveal === 'function'
								? PlatformBridge.slideKeyFromReveal()
								: null;
						},
						isGuest: function () {
							return window.PlatformBridge &&
								typeof PlatformBridge.isGuest === 'function'
								? PlatformBridge.isGuest()
								: false;
						},
					});
				}
				Reveal.layout();
			});
		</script>
	</body>
</html>
